[project]
name = "rag-in-action"
version = "0.1.0"
description = "RAG从小白到专家课程配套教学代码"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "HuangZurong", email = "hzr@example.com" }
]
keywords = [
    "rag",
    "langchain",
    "retrieval-augmented-generation",
    "lcel",
    "hybrid-search",
    "bm25",
    "reranking",
    "multimodal-rag",
    "amazon-ecommerce"
]
dependencies = [
    "accelerate>=0.29.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-qdrant>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "numpy>=1.26.0",
    "open-clip-torch>=2.24.0",
    "pillow>=10.2.0",
    "pydantic>=2.7.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "rich>=13.7.0",
    "sentence-transformers>=2.7.0",
    "tabulate>=0.9.0",
    "timm>=0.9.16",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
