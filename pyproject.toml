[project]
name = "rag-in-action"
version = "0.2.0"
description = "RAG 入门课程配套 Notebook"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "HuangZurong", email = "hzr@example.com" }
]
dependencies = [
    "python-dotenv>=1.0.0",
    "jupyterlab>=4.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
